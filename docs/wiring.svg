<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">fnc-power – Anschlussplan</title>
<desc id="desc">24-V-Netzteil an VIN und GND des CONTROLLINO MAXI Automation. Ein Schliessertaster verbindet plus 24 Volt mit A0. AO0 geht zum 0–10-V-Eingang des Dimmers, GND zu dessen Signalmasse.</desc>
<defs><style>
text { font-family:Arial,sans-serif; fill:#172b40; font-size:18px }
.title { font-size:30px; font-weight:bold }
.heading { font-size:21px; font-weight:bold }
.small { font-size:16px; fill:#465b70 }
.terminal { fill:white; stroke:#172b40; stroke-width:2 }
.wire { fill:none; stroke-width:4; stroke-linejoin:round; stroke-linecap:round }
</style></defs>
<rect width="1200" height="760" fill="#f5f8fc"/>
<text x="45" y="52" class="title">fnc-power · Anschlussplan</text>
<text x="45" y="84" class="small">CONTROLLINO MAXI Automation · schematisch, keine räumliche Klemmenanordnung</text>
<rect x="45" y="170" width="220" height="220" rx="12" fill="white" stroke="#b9c8d8" stroke-width="2"/>
<text x="65" y="210" class="heading">Netzteil</text>
<text x="65" y="240">24 V DC</text>
<text x="185" y="279">+24 V</text><circle cx="265" cy="275" r="6" class="terminal"/>
<text x="180" y="359">0 V / −</text><circle cx="265" cy="355" r="6" class="terminal"/>
<rect x="470" y="170" width="310" height="350" rx="12" fill="#e6eef8" stroke="#91a9c4" stroke-width="2"/>
<text x="495" y="211" class="heading">CONTROLLINO</text>
<text x="495" y="239">MAXI Automation</text>
<text x="490" y="281">VIN / +24 V</text><circle cx="470" cy="275" r="6" class="terminal"/>
<text x="490" y="361">GND</text><circle cx="470" cy="355" r="6" class="terminal"/>
<text x="490" y="451">A0 · Tastereingang</text><circle cx="470" cy="445" r="6" class="terminal"/>
<text x="620" y="313" class="heading">AO0</text><circle cx="780" cy="305" r="6" class="terminal"/>
<text x="620" y="338" class="small">0–10 V OUT</text>
<text x="695" y="400">GND</text><circle cx="780" cy="395" r="6" class="terminal"/>
<text x="495" y="490" class="small">AO1 bleibt frei.</text>
<rect x="945" y="170" width="220" height="350" rx="12" fill="white" stroke="#b9c8d8" stroke-width="2"/>
<text x="970" y="212" class="heading">Dimmer</text>
<text x="970" y="241" class="small">Steueranschlüsse</text>
<circle cx="945" cy="305" r="6" class="terminal"/><text x="965" y="310">0–10 V IN / DIM+</text>
<circle cx="945" cy="395" r="6" class="terminal"/><text x="965" y="400">Signal-GND / DIM−</text>
<text x="970" y="450" class="small">Versorgung und LED</text>
<text x="970" y="475" class="small">nach Dimmer-Handbuch</text>
<path d="M271 275 H464" class="wire" stroke="#d1453b"/>
<path d="M271 355 H464" class="wire" stroke="#2464a1"/>
<path d="M310 275 V445 H345" class="wire" stroke="#d1453b"/>
<circle cx="310" cy="275" r="6" fill="#d1453b"/>
<circle cx="350" cy="445" r="5" class="terminal"/><circle cx="405" cy="445" r="5" class="terminal"/>
<path d="M350 440 L397 417 M377 405 V391 M365 391 H389" class="wire" stroke="#172b40"/>
<path d="M411 445 H464" class="wire" stroke="#d1453b"/>
<text x="290" y="490" class="small">Taster (Schliesser)</text>
<text x="290" y="514" class="small">unbetätigt offen</text>
<path d="M786 305 H939" class="wire" stroke="#16866b"/>
<text x="820" y="288" class="small">Signal</text>
<path d="M786 395 H939" class="wire" stroke="#2464a1"/>
<text x="810" y="423" class="small">Signalmasse</text>
<text x="45" y="584" class="heading">Verdrahtung</text>
<text x="45" y="615">1. +24 V → VIN und Taster · anderer Tasterkontakt → A0</text>
<text x="45" y="645">2. Netzteil 0 V → GND · AO0 → Dimmer 0–10 V IN · GND → Dimmer Signal-GND</text>
<text x="45" y="691" class="small">Nur Schraubklemmen verwenden. AO0 im Spannungsmodus 0–10 V betreiben.</text>
<text x="45" y="717" class="small">DIM+/DIM− sind beispielhafte Namen; Anschlussfreigabe und tatsächliche Klemmen am Dimmer prüfen.</text>
<text x="45" y="742" class="small">GND-Anschlüsse am CONTROLLINO gehören zur gleichen 0-V-Bezugsspannung.</text>
</svg>