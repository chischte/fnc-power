[platformio]
default_envs = kincony_dm4

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    -I"${PROJECT_DIR}"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:tools/network_config.py
    post:tools/ota_upload_config.py
lib_deps =
    adafruit/Adafruit MCP4728@1.0.10
monitor_speed = 115200

[env:kincony_dm4]
upload_protocol = esptool

[env:kincony_dm4_ota]
upload_protocol = espota
upload_port = fnc-power.local
